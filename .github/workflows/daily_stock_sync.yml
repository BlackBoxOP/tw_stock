name: Daily Stock Parquet Sync

on:
  schedule:
    # 台灣時間平日 15:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
    # 台灣時間平日 15:40 (UTC 07:40)，避開 :00 與 :30 全球高峰擁擠時段
    - cron: '40 7 * * 1-5'
    # 台灣時間平日 20:30 (UTC 12:30)，抓取完整融資融券信用交易與分點主力
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      init_mode:
        description: '是否跑全歷史初始化 (初次執行可勾選)'
        required: false
        type: boolean
        default: false
      force_mode:
        description: '是否強制重新抓取 (略過 Checkpoint)'
        required: false
        type: boolean
        default: false
      backfill_days:
        description: '回補歷史交易日天數 (例如 10 或 30，填 0 則不回補)'
        required: false
        type: string
        default: '0'

jobs:
  sync-stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch TWSE OpenAPI 5-Minute Intraday Statistics
        run: python scripts/fetch_twse_openapi_5m.py

      - name: Fetch Institutional Trading (Foreign / Trust / Dealers Net Buy/Sell)
        run: python scripts/fetch_institutional_daily.py

      - name: Fetch Margin Trading Balance (Margin / Short Selling)
        run: python scripts/fetch_margin_daily.py

      - name: Fetch Valuation Ratios (PE / PB / Dividend Yield)
        run: python scripts/fetch_valuation_daily.py

      - name: Fetch Market & Sector Indices
        run: python scripts/fetch_market_indices.py

      - name: Fetch Monthly Revenue Summary
        run: python scripts/fetch_monthly_revenue.py

      - name: Fetch Quarterly EPS & Financial Statements
        run: python scripts/fetch_quarterly_eps.py

      - name: Fetch Dividend Schedules & Ex-Right Results
        run: python scripts/fetch_dividends.py

      - name: Fetch TDCC Shareholding Distribution (Large Holders)
        run: python scripts/fetch_tdcc_distribution.py

      - name: Fetch Key Broker Branch Trading Flows
        run: python scripts/fetch_broker_trading.py --stocks 2330 2317 2454 2308 2382 3231 2357 2603 --export-parquet

      - name: Fetch TAIFEX Futures Institutional Positions (Foreign Net OI)
        run: python scripts/fetch_taifex_institutional.py

      - name: Fetch TWSE SBL & Credit Limits (Securities Lending & Short Sale)
        run: python scripts/fetch_sbl_daily.py

      - name: Generate Daily Quantitative Market Summary Report
        run: python scripts/generate_daily_report.py

      - name: Run Historical Backfill (Optional)
        run: |
          DAYS="${{ github.event.inputs.backfill_days }}"
          if [ "$DAYS" != "0" ] && [ -n "$DAYS" ]; then
            echo "正在回補過去 $DAYS 個交易日之歷史籌碼與評價面資料..."
            python scripts/backfill_history.py --days $DAYS
          fi
          if [ "${{ github.event.inputs.init_mode }}" = "true" ]; then
            echo "正在執行全量歷史基本面回補 (營收與 EPS)..."
            python scripts/backfill_fundamental.py
          fi

      - name: Run Price Data Sync Script (1-min & Daily hybrid)
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.init_mode }}" = "true" ]; then
            FLAGS="$FLAGS --init"
          fi
          if [ "${{ github.event.inputs.force_mode }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python scripts/sync_all_partitions.py $FLAGS

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "今日無新交易資料。"
          else
            git commit -m "Auto: Update stock parquet dataset (OHLCV, Institutional, Margin, Valuation, Revenue, EPS, Broker, TDCC, Dividends) [skip ci]"
            git commit -m "Auto: Update stock parquet dataset & daily quant report (OHLCV, TAIFEX, SBL, Institutional, Margin, Valuation, Revenue, EPS, Broker, TDCC, Dividends) [skip ci]"
            git push
          fi

