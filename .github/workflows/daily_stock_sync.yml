name: Daily Stock Parquet Sync

on:
  schedule:
    # 台灣時間平日 15:40 (UTC 07:40)，避開 :00 與 :30 全球高峰擁擠時段
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
    inputs:
      init_mode:
        description: '是否跑全歷史初始化 (初次執行可勾選)'
        required: false
        type: boolean
        default: false
      force_mode:
        description: '是否強制重新抓取 (略過 Checkpoint)'
        required: false
        type: boolean
        default: false

jobs:
  sync-stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch TWSE OpenAPI 5-Minute Intraday Statistics
        run: python scripts/fetch_twse_openapi_5m.py

      - name: Run Data Sync Script (1-min & Daily hybrid)
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.init_mode }}" = "true" ]; then
            FLAGS="$FLAGS --init"
          fi
          if [ "${{ github.event.inputs.force_mode }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python scripts/sync_all_partitions.py $FLAGS

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "今日無新交易資料。"
          else
            git commit -m "Auto: Update stock parquet dataset [skip ci]"
            git push
          fi

