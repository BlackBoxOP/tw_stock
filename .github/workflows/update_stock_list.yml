name: Weekly Update Stock List

on:
  schedule:
    # 每週日 UTC 18:00 (台灣時間週一凌晨 02:00)
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Fetch List Script
        run: python scripts/fetch_tw_stock_list.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tw_stock_list.*
          if git diff --staged --quiet; then
            echo "股票名單無變更。"
          else
            git commit -m "Auto: Weekly refresh TW stock list [skip ci]"
            git push
          fi

